# Forward Model Ball Tracking - configuration
# All tunable parameters live here so behaviour can be changed without editing code.

arena:
  width: 8.0          # x extent (meters)
  depth: 8.0          # y extent (meters)
  height: 1.5         # wall height (meters)

ball:
  radius: 0.18
  speed: 1.5          # m/s, constant cruising speed
  max_turn_deg: 65    # higher the number = sharper turns = less smooth, harder to predict
  waypoint_interval: 1.5   # seconds before forcing a new random waypoint
  margin: 0.5         # keep waypoints this far from walls
  keep_out: 1.0       # ball steers around this radius near the robot (m)

robot:
  start_pos: [0.0, -3.8]   # x, y on the floor (stationary base, near wall)
  base_radius: 0.28
  base_height: 0.18
  strike_speed: 5.0        # m/s — how fast the robot charges during a strike
  strike_duration_s: 1.0   # seconds — ball keeps moving freely until this ends

camera:
  width: 640
  height: 480
  fovy: 90             # vertical field of view (degrees) - wide so the arena fits
  mount_height: 1.4    # camera height above robot base (angled top-down view)
  tilt: 0.75           # downward tilt factor for the camera up-vector

display:
  width: 960           # full-screen render resolution (1280x720 = sharper, slower)
  height: 540

# Simulated perception/action latency. horizon = sense + think + move.
latency_ms:
  sense: 70
  think: 60
  move: 50

sim:
  dt_ms: 10            # simulation/frame timestep in milliseconds
  realtime: true       # sleep to roughly match wall-clock time when viewing live

# State is estimated in WORLD coordinates (meters) on the ground plane, then
# projected back to the image. Constant-velocity in world space is an accurate
# model for the ball, so predictions converge instead of diverging.
forward_model:
  process_noise: 6.0           # Q accel scale (m/s^2) - turning ball needs some
  measurement_noise: 0.02      # R (m) - back-projected detection accuracy
  initial_velocity_var: 25.0   # large -> velocity unknown at start -> early overshoot
  residual_threshold_px: 3
    # the value of the residual that is considered good.
    # smaller means the prediction error (gap between predicted and actual)
    # must be smaller to be considered good
  confidence_frames: 50
    # consecutive good frames before the robot strikes (robot's confidence)
    # smaller = robot need fewer good frames
    # larger = robot need more good frames

perception:
  detector: sim         # phase 1: "sim". phase 2: "yolo"
  noise_px: 2.0         # gaussian noise added to simulated detections
