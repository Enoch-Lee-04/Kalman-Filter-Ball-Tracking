name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests + harness (${{ matrix.os }})
    strategy:
      fail-fast: false   # if only one OS fails, that points at a platform difference
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # Nothing here may render. Any attempt to create a MuJoCo renderer fails
      # loudly instead of needing a display.
      MUJOCO_GL: disable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install locked dependencies (hash-checked)
        run: python -m pip install --require-hashes -r requirements.txt -r requirements-dev.txt

      - name: Unit tests + seed-7 regression
        run: python -m pytest

      - name: 50-run no-render harness
        run: >
          python -m tools.batch --seeds 0-49 --frames 1500
          --json batch-results.json --md "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: batch-results-${{ matrix.os }}
          path: batch-results.json
